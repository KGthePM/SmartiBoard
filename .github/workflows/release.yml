name: Release

# Tag-driven: `git tag v3.0.0 && git push origin v3.0.0` builds the installers and opens a
# DRAFT release with them attached. Nothing is public until someone presses publish, which is
# the point — CI proves the artifacts build, not that they launch, and a Windows or Linux
# build deserves a human double-click before it goes out.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      # A release build should not be the first place a break is noticed.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Install desktop shell dependencies
        working-directory: desktop
        run: npm ci

      # `dist:<target>` stages first: it builds the Next app in standalone mode, copies it plus
      # .next/static, and swaps in the better-sqlite3 prebuild for Electron's ABI. No compiler
      # is involved anywhere — see desktop/stage.js.
      - name: Build installers
        working-directory: desktop
        run: npm run dist:${{ matrix.target }}
        env:
          # Deliberately NO GH_TOKEN. electron-builder treats that variable as "you want to
          # publish": it resolves a publish target to write app-update.yml during afterPack,
          # and fails the build when it cannot work out the repository — regardless of
          # `--publish never`, which only governs the upload itself. This job builds
          # artifacts; the release job uploads them. Nothing here should touch GitHub.
          #
          # Nothing is signed either. This keeps electron-builder from hunting for
          # certificates it will not find and failing on the search rather than on the build.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smarti-board-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
