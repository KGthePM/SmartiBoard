name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` honours .npmrc's engine-strict and runs scripts/check-node.js, so the Node
      # version above is not decoration — it is the same 22-26 gate every user gets.
      - run: npm ci

      - run: npm test
      - run: npm run typecheck
      - run: npm run build
